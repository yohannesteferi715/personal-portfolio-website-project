<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20b2a6" />
      <stop offset="100%" stop-color="#61dafb" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11181e" />
      <stop offset="100%" stop-color="#070c0e" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark glass squircle base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="#20b2a6" stroke-width="2.5" stroke-opacity="0.45" />

  <!-- Subtle ambient inner glow -->
  <circle cx="32" cy="32" r="22" fill="#20b2a6" fill-opacity="0.08" />

  <!-- Monogram: 'Y' and 'T' interconnected -->
  <!-- 'Y' arms and stem -->
  <path d="M14 18 L26 33 L26 46" stroke="url(#primary-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-glow)" />
  <path d="M38 18 L26 33" stroke="url(#primary-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-glow)" />

  <!-- 'T' crossbar and stem -->
  <path d="M34 23 L51 23" stroke="#61dafb" stroke-width="4.5" stroke-linecap="round" filter="url(#soft-glow)" />
  <path d="M42.5 23 L42.5 46" stroke="#61dafb" stroke-width="4.5" stroke-linecap="round" filter="url(#soft-glow)" />

  <!-- Pulsing system node dot -->
  <circle cx="50" cy="14" r="3" fill="#20b2a6" />
  <circle cx="50" cy="14" r="5" stroke="#20b2a6" stroke-width="1.2" stroke-opacity="0.5" />
</svg>
